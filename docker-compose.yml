version: "3.8"

services:
  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
